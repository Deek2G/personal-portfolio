<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="src/style.css" />

  <!-- Link to Phosphor icons -->
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EJ Nisperos</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- main content wrapper -->
  <div id="main-content" class="main-content">
    <!-- navbar -->
    <div class="header">
      <div class="navbar">
        <!-- logo -->
        <h1 class="nav-logo"><a href="#">EJ Nisperos</a></h1>
        <!-- navigation menu -->
        <div class="nav-menu">
          <a href="#work">Work</a>
          <a href="about.html">About</a>
          <a href="#contact">Contact</a>
        </div>
      </div>
    </div>
    <!-- Hero Section -->
    <div class="hero-container">
      <div class="hero-left">
        <h1>Hi, I am</h1>
        <h1>Ernest Josh Nisperos</h1>
        <p>
          A Davao based front-end developer with a passion about building accessible and user
          friendly websites.
        </p>

        <!-- Hero Action Buttons -->
        <div class="hero-btns">
          <button class="btn-hero-contact"
            onclick="document.getElementById('Contact').scrollIntoView({behavior: 'smooth'})">
          <div class="btn-text">Contact Me</div>
          <div class="btn-dot"></div>
          </button>
          <a href="https://github.com" target="_blank" alt="GitHub Profile">
            <i class="ph ph-fill ph-github-logo"></i>
          </a>
          <a href="https://linkedin.com" target="_blank" alt="LinkedIn Profile">
            <i class="ph ph-fill ph-linkedin-logo"></i>
          </a>
        </div>
      </div>
      <!-- Hero Right Content -->
      <div class="hero-right"></div>
      <img class="hero-image" src="public/my-photo.jpg" alt="EJ Nisperos" />
    </div>
  </div>
  <!-- JS file link -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
